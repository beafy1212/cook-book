<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High-Protein Recipe Book</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --ink:#1C2317; --muted:#5E6857; --line:#D6DCCF;
  --zaatar:#3E5B2A; --saffron:#D9A441; --sumac:#A8443B;
  --chicken:#E0AE3A; --beef:#8E2C34;
  --t-leb:#DDE9CF; --t-leb-i:#2F4A1C; --t-med:#D5E6EA; --t-med-i:#1E4B57;
  --t-mex:#F6DEC6; --t-mex-i:#7A3A0E; --t-ita:#F4D6D8; --t-ita-i:#7C2330;
  --t-ind:#F3E6B8; --t-ind-i:#6A4E07; --t-cla:#E0E3EA; --t-cla-i:#343B4E;
  --focus:#3E5B2A; --t-thai:#E4DEF3; --t-thai-i:#4A3A78;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A11; --surface:#1D2519; --ink:#E9EEE3; --muted:#9BA692; --line:#2E3829;
    --zaatar:#9CC27A; --saffron:#E7B955; --sumac:#E0776B; --chicken:#E7B955; --beef:#D06A6F;
    --t-leb:#2A3A1F; --t-leb-i:#C4E0A6; --t-med:#1E353B; --t-med-i:#A9D6E0;
    --t-mex:#3E2A1A; --t-mex-i:#F2C29A; --t-ita:#3D2226; --t-ita-i:#F0B3B9;
    --t-ind:#3A321A; --t-ind-i:#EBD38A; --t-cla:#262B36; --t-cla-i:#C6CCDA; --focus:#9CC27A; --t-thai:#2C2540; --t-thai-i:#CBBEF0;
  }
}
:root[data-theme="dark"]{
  --bg:#141A11; --surface:#1D2519; --ink:#E9EEE3; --muted:#9BA692; --line:#2E3829;
  --zaatar:#9CC27A; --saffron:#E7B955; --sumac:#E0776B; --chicken:#E7B955; --beef:#D06A6F;
  --t-leb:#2A3A1F; --t-leb-i:#C4E0A6; --t-med:#1E353B; --t-med-i:#A9D6E0;
  --t-mex:#3E2A1A; --t-mex-i:#F2C29A; --t-ita:#3D2226; --t-ita-i:#F0B3B9;
  --t-ind:#3A321A; --t-ind-i:#EBD38A; --t-cla:#262B36; --t-cla-i:#C6CCDA; --focus:#9CC27A; --t-thai:#2C2540; --t-thai-i:#CBBEF0;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-optical-sizing:auto;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.top{padding-top:48px;padding-bottom:20px}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:.95;letter-spacing:-.03em;font-weight:800;margin:0 0 14px;font-variation-settings:"opsz" 96;max-width:12ch}
.lede{color:var(--muted);font-size:1.05rem;margin:0;max-width:52ch}
.theme{position:absolute;right:20px;top:calc(20px + env(safe-area-inset-top,0px));background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted);cursor:pointer}

/* Controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.row + .row{margin-top:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chipbtn-unused{flex:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;opacity:.55;transition:opacity .15s}
.chipbtn[aria-pressed="true"]{opacity:1;border-color:currentColor}
.sort{margin-left:auto;flex:none;font:inherit;font-size:.88rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 10px}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.meat{background:var(--surface);border:1px solid var(--line)}
.prep{border:1px dashed var(--line);color:var(--muted)}
.c-Lebanese{background:var(--t-leb);color:var(--t-leb-i)}
.c-Mediterranean{background:var(--t-med);color:var(--t-med-i)}
.c-Mexican{background:var(--t-mex);color:var(--t-mex-i)}
.c-Italian{background:var(--t-ita);color:var(--t-ita-i)}
.c-Indian{background:var(--t-ind);color:var(--t-ind-i)}
.c-Thai{background:var(--t-thai);color:var(--t-thai-i)}
.c-Classic{background:var(--t-cla);color:var(--t-cla-i)}

/* List */
.list{list-style:none;margin:0;padding:8px 0 64px}
.item a{display:grid;grid-template-columns:6.2rem 1fr auto;gap:18px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item a:hover .name{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.prot{font-size:2.9rem;font-weight:800;letter-spacing:-.04em;line-height:.9;color:var(--zaatar);font-variation-settings:"opsz" 96}
.prot small{display:block;font-size:.78rem;letter-spacing:0;font-weight:600;color:var(--muted);margin-top:6px}
.name{font-size:1.2rem;font-weight:700;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.band{display:flex;height:6px;border-radius:3px;overflow:hidden;max-width:280px}
.band span:nth-child(1){background:var(--zaatar)}.band span:nth-child(2){background:var(--saffron)}.band span:nth-child(3){background:var(--sumac)}
.kcal{text-align:right;font-weight:700;font-size:1.05rem}
.kcal .u{font-size:.8rem;font-weight:600;color:var(--muted)}
.kcal small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);padding-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
@media (max-width:560px){
  .item a{grid-template-columns:4.4rem 1fr;gap:14px}
  .prot{font-size:2.2rem}
  .kcal{grid-column:2;text-align:left;font-size:.95rem}
  .kcal .u{font-size:.8rem;font-weight:600;color:var(--muted)}
.kcal small{display:inline;margin-left:4px}
}

/* Detail */
.detail{display:none;padding-bottom:80px}
body.show-detail .detail{display:block}
body.show-detail .browse{display:none}
.back{display:inline-flex;align-items:center;gap:6px;margin:24px 0 8px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;cursor:pointer;font-size:.95rem}
.detail h2{font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.03em;font-weight:800;margin:8px 0 14px;font-variation-settings:"opsz" 96}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dmeta .time{color:var(--muted);font-size:.9rem;margin-left:4px}
.macros{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;margin:28px 0 10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.macros div{padding:14px 0 12px}
.macros div + div{padding-left:14px;border-left:1px solid var(--line)}
.macros b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.macros div:first-child b{font-size:2.6rem;color:var(--zaatar)}
.macros span{font-size:.82rem;color:var(--muted)}
.macros .p b{color:var(--zaatar)}
.detail .band{max-width:none;height:8px;margin-bottom:28px}
.servings{display:flex;align-items:center;gap:14px;margin:0 0 28px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;background:none;font-size:1.3rem;cursor:pointer;border-radius:999px}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:5.5rem;text-align:center;font-weight:700}
.servings p{margin:0;color:var(--muted);font-size:.88rem}
.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:40px}
@media (max-width:720px){.cols{grid-template-columns:1fr;gap:28px}.macros{grid-template-columns:1fr 1fr}.macros div:nth-child(3){padding-left:0;border-left:0}.macros div:nth-child(n+3){border-top:1px solid var(--line)}}
h3{font-size:1.1rem;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h3.sub{margin-top:28px}
h3 small{font-weight:500;color:var(--muted);font-size:.82rem}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid var(--line)}
.checks label{display:flex;gap:12px;padding:11px 0;cursor:pointer;align-items:flex-start}
.checks input{appearance:none;flex:none;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--line);border-radius:6px;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.checks input::after{content:"";width:10px;height:6px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.checks input:checked{background:var(--zaatar);border-color:var(--zaatar)}
.checks input:checked::after{opacity:1}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.steps label{gap:14px}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-content:center;font-weight:800;font-size:.85rem;transition:background .15s,color .15s}
.steps input{position:absolute;opacity:0;pointer-events:none}
.steps input:checked ~ .n{background:var(--zaatar);border-color:var(--zaatar);color:var(--bg)}
.steps input:checked ~ .txt{color:var(--muted)}
.steps input:focus-visible ~ .n{outline:2px solid var(--focus);outline-offset:2px}
.qty{font-weight:700}
.reset{margin-top:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:.88rem}
.note{color:var(--muted);font-size:.85rem;margin:40px 0 0;border-top:1px solid var(--line);padding-top:16px;max-width:60ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.pager a{color:inherit;text-decoration:none;font-weight:700;max-width:48%}
.pager a small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}
.pager a:last-child{text-align:right;margin-left:auto}

@media (prefers-reduced-motion:no-preference){
  body.show-detail .detail{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<button class="theme" id="theme" type="button" aria-label="Toggle dark mode">Dark</button>

<div class="browse">
  <header class="top wrap">
    <h1>High-Protein Recipe Book</h1>
    <p class="lede" id="lede">Single-serving high-protein meals. Tap a recipe to scale it and cook along.</p>
  </header>
  <div class="controls">
    <div class="wrap">
      <div class="row">
        <div class="seg" role="group" aria-label="Meat">
          <button type="button" data-meat="all" aria-pressed="true">All</button>
          <button type="button" data-meat="Chicken" aria-pressed="false">Chicken</button>
          <button type="button" data-meat="Beef" aria-pressed="false">Beef</button>
        </div>
        <select class="sort" id="sort" aria-label="Sort recipes">
          <option value="order">Book order</option>
          <option value="p">Most protein</option>
          <option value="kcal">Fewest calories</option>
          <option value="ratio">Most protein per kcal</option>
          <option value="time">Quickest</option>
        </select>
      </div>
    </div>
  </div>
  <main class="wrap">
    <div class="legend" aria-hidden="true"><span><i style="background:var(--zaatar)"></i>Protein</span><span><i style="background:var(--saffron)"></i>Carbs</span><span><i style="background:var(--sumac)"></i>Fat</span><span>share of calories</span></div>
    <ul class="list" id="list"></ul>
  </main>
</div>

<article class="detail wrap" id="detail" aria-live="polite"></article>

<script>

{"id":2,"name":"Chicken Shawarma Bowl","meat":"Chicken","cuisine":"Lebanese","prep":"Marinate ahead","time":"25 min + 1 h marinade","mins":25,"kcal":560,"p":67,"c":41,"f":12,"ing":["220 g chicken breast, sliced thin","60 g whole-wheat pita","200 g lettuce, tomato, cucumber, pickles, onion","5 ml olive oil","Marinade: juice of 1/2 lemon, 1 tsp seven-spice, 1/2 tsp each cumin, paprika, turmeric, cinnamon pinch, 2 garlic cloves, salt"],"steps":["Toss the chicken with the marinade; chill 1 h (overnight is better).","Mix the yogurt with 1 grated garlic clove, lemon juice and salt for a light toum-style sauce.","Heat the oil in a pan over high heat. Cook the chicken 6–8 min until charred at the edges.","Toast the pita and cut into strips or chips.","Build the bowl: veg, chicken, pickles, pita, garlic sauce on top."],"sauce":["100 g 0% Greek yogurt","1 garlic clove, grated","Lemon juice, salt"]},

{"id":5,"name":"Chicken & Batata Harra Tray Bake","meat":"Chicken","cuisine":"Lebanese","prep":"Oven","time":"40 min","mins":40,"kcal":600,"p":59,"c":56,"f":14,"ing":["230 g chicken breast, cut in chunks","300 g potatoes, 2 cm cubes","100 g red bell pepper, in strips","8 ml olive oil","1 tsp paprika, 1/2 tsp seven-spice, salt"],"steps":["Heat the oven to 220 °C.","Toss the potatoes with half the oil, paprika and salt; roast 20 min.","Toss the chicken and pepper with the rest of the oil, seven-spice and salt. Add to the tray.","Roast 18–20 min more until the chicken hits 74 °C and the potatoes are crisp.","Mash the garlic, coriander and chili with a pinch of salt; toss through the hot tray with the lemon juice."],"sauce":["4 garlic cloves","A handful of fresh coriander","1 tsp chili flakes (or 1 fresh chili)","1/2 lemon"],"sauceName":"Dressing"},
{"id":6,"name":"Creamy Tomato Chicken Pasta","meat":"Chicken","cuisine":"Italian","prep":"Stovetop","time":"25 min","mins":25,"kcal":620,"p":61,"c":65,"f":11,"ing":["200 g chicken breast, diced","70 g penne or fusilli (dry)","60 g baby spinach","Cooking spray","Fresh basil, salt, pepper"],"steps":["Boil the pasta in salted water; save 60 ml of the water before draining.","Spray a pan, cook the chicken over medium-high 6–7 min; season.","Add garlic 30 s, then passata and herbs; simmer 5 min.","Stir in the cream cheese until smooth, then the spinach until wilted.","Toss in the pasta, loosen with pasta water, finish with basil."],"sauce":["200 g passata","40 g light cream cheese","2 garlic cloves, 1 tsp Italian herbs, chili flakes"]},

];
const state={meat:"all",sort:"order"};
let store={checks:{},serv:{}};
try{const s=localStorage.getItem("hprb-v1");if(s)store=Object.assign(store,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("hprb-v1",JSON.stringify(store))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const meatColor=m=>m==="Beef"?"var(--beef)":"var(--chicken)";
const tags=r=>`<span class="tag meat"><span class="dot" style="background:${meatColor(r.meat)}"></span>${r.meat}</span><span class="tag c-${({Greek:"Mediterranean",Levantine:"Lebanese",Gulf:"Indian"})[r.cuisine]||r.cuisine}">${r.cuisine}</span><span class="tag prep">${r.prep}</span>`;
const band=r=>{const P=r.p*4,C=r.c*4,F=r.f*9,T=P+C+F;return `<div class="band" role="img" aria-label="Calories: ${Math.round(P/T*100)}% protein, ${Math.round(C/T*100)}% carbs, ${Math.round(F/T*100)}% fat"><span style="width:${P/T*100}%"></span><span style="width:${C/T*100}%"></span><span style="width:${F/T*100}%"></span></div>`};

document.querySelectorAll("[data-meat]").forEach(b=>b.addEventListener("click",()=>{state.meat=b.dataset.meat;document.querySelectorAll("[data-meat]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()}));
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;renderList()});

function visible(){
  let r=R.filter(x=>state.meat==="all"||x.meat===state.meat);
  const s=state.sort;
  if(s==="p")r.sort((a,b)=>b.p-a.p);else if(s==="kcal")r.sort((a,b)=>a.kcal-b.kcal);else if(s==="ratio")r.sort((a,b)=>b.p/b.kcal-a.p/a.kcal);else if(s==="time")r.sort((a,b)=>a.mins-b.mins||a.id-b.id);
  return r;
}
function renderList(){
  const r=visible(),el=document.getElementById("list");
  if(!r.length){el.innerHTML=`<li class="empty">No recipes match these filters.<br><button type="button" id="clear">Clear filters</button></li>`;
    document.getElementById("clear").onclick=()=>{state.meat="all";document.querySelectorAll("[data-meat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.meat==="all"));renderList()};return}
  el.innerHTML=r.map(x=>`<li class="item"><a href="#r${x.id}"><div class="prot num">${x.p}g<small>protein</small></div><div><p class="name">${esc(x.name)}</p><div class="tags">${tags(x)}</div>${band(x)}</div><div class="kcal num">${x.kcal} <span class="u">kcal</span><small>${x.time.replace(/ \+.*/,"")}</small></div></a></li>`).join("");
}

// scaling
function fmt(v){
  if(Math.abs(v-Math.round(v))<.01)return String(Math.round(v));
  if(v>=10)return String(Math.round(v));
  const w=Math.floor(v),fr=v-w,map=[[.25,"¼"],[.5,"½"],[.75,"¾"],[1/3,"⅓"],[2/3,"⅔"]];
  for(const [k,s] of map)if(Math.abs(fr-k)<.04)return (w?w:"")+s;
  return v.toFixed(1).replace(/\.0$/,"");
}
function scaleIng(t,n){
  return esc(t).replace(/(?<![\d\/.])(\d+\/\d+|\d+(?:\.\d+)?)(?![\d\/.])(?!\s*(?:%|°|cm\b|mm\b|h\b|min\b|s\b|-))/g,(m,q)=>{
    const v=q.includes("/")?q.split("/").reduce((a,b)=>a/b):parseFloat(q);
    const out=n===1?(q==="1/2"?"½":q):fmt(v*n);
    return `<span class="qty">${out}</span>`;
  });
}
const scaleStep=(t,n)=>esc(t).replace(/(\d+)(\s?ml)/g,(m,q,u)=>`<span class="qty">${fmt(q*n)}</span>${u}`);

function renderDetail(id){
  const r=R.find(x=>x.id===id);if(!r)return false;
  const n=store.serv[id]||1,ck=store.checks[id]||{};
  const i=R.indexOf(r),prev=R[i-1],next=R[i+1];
  document.title=r.name+" · High-Protein Recipe Book";
  const d=document.getElementById("detail");
  d.innerHTML=`
  <button class="back" type="button" id="back">← All recipes</button>
  <h2>${esc(r.name)}</h2>
  <div class="dmeta">${tags(r)}<span class="time">${r.time}</span></div>
  <div class="macros num">
    <div class="p"><b>${Math.round(r.p*n)}g</b><span>protein${n>1?" total":""}</span></div>
    <div><b>${Math.round(r.kcal*n)}</b><span>kcal${n>1?" total":""}</span></div>
    <div><b>${Math.round(r.c*n)}g</b><span>carbs</span></div>
    <div><b>${Math.round(r.f*n)}g</b><span>fat</span></div>
  </div>
  ${band(r)}
  <div class="servings">
    <div class="stepper"><button type="button" id="minus" aria-label="Fewer portions" ${n<=1?"disabled":""}>−</button><output aria-live="polite">${n} ${n===1?"portion":"portions"}</output><button type="button" id="plus" aria-label="More portions" ${n>=6?"disabled":""}>+</button></div>
    <p>${n>1?`Batch for meal prep: ${n} × ${r.kcal} kcal, ${r.p} g protein each.`:"Scale up to batch-cook for the week."}</p>
  </div>
  <div class="cols">
    <section><h3>Ingredients <small>raw / dry weights</small></h3>
      <ul class="checks">${r.ing.map((t,k)=>`<li><label><input type="checkbox" data-k="i${k}" ${ck["i"+k]?"checked":""}><span>${scaleIng(t,n)}</span></label></li>`).join("")}</ul>
      ${r.sauce?`<h3 class="sub">${r.sauceName||"Sauce"}</h3><ul class="checks">${r.sauce.map((t,k)=>`<li><label><input type="checkbox" data-k="x${k}" ${ck["x"+k]?"checked":""}><span>${scaleIng(t,n)}</span></label></li>`).join("")}</ul>`:""}
    </section>
    <section><h3>Method <small>tap a step when done</small></h3>
      <ol class="checks steps" style="padding:0">${r.steps.map((t,k)=>`<li><label><input type="checkbox" data-k="s${k}" ${ck["s"+k]?"checked":""}><span class="n">${k+1}</span><span class="txt">${scaleStep(t,n)}</span></label></li>`).join("")}</ol>
      <button class="reset" type="button" id="reset">Reset checklist</button>
    </section>
  </div>
  <p class="note">Macros are estimated from standard food values. Log your actual brands in your tracker; yogurt, bread and mince vary most. Spices, herbs, garlic and lemon count as negligible.</p>
  <nav class="pager" aria-label="More recipes">${prev?`<a href="#r${prev.id}"><small>Previous</small>${esc(prev.name)}</a>`:"<span></span>"}${next?`<a href="#r${next.id}"><small>Next</small>${esc(next.name)}</a>`:""}</nav>`;
  d.querySelector("#back").onclick=()=>{location.hash=""};
  const setN=v=>{store.serv[id]=v;save();renderDetail(id)};
  d.querySelector("#minus").onclick=()=>setN(Math.max(1,n-1));
  d.querySelector("#plus").onclick=()=>setN(Math.min(6,n+1));
  d.querySelectorAll("input[data-k]").forEach(inp=>inp.onchange=()=>{store.checks[id]=store.checks[id]||{};store.checks[id][inp.dataset.k]=inp.checked;save()});
  d.querySelector("#reset").onclick=()=>{store.checks[id]={};save();renderDetail(id)};
  return true;
}
let lastScroll=0;
function route(){
  const m=location.hash.match(/^#r(\d+)$/);
  if(m&&renderDetail(+m[1])){if(!document.body.classList.contains("show-detail"))lastScroll=scrollY;document.body.classList.add("show-detail");scrollTo(0,0)}
  else{document.body.classList.remove("show-detail");document.title="High-Protein Recipe Book";scrollTo(0,lastScroll)}
}
addEventListener("hashchange",route);

// theme toggle
const tb=document.getElementById("theme");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
const syncTheme=()=>{tb.textContent=isDark()?"Light":"Dark"};
try{const t=localStorage.getItem("hprb-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
tb.onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("hprb-theme",t)}catch(e){}syncTheme()};
syncTheme();

{const k=R.map(x=>x.kcal),q=R.map(x=>x.p),b=R.filter(x=>x.meat==="Beef").length;document.getElementById("lede").textContent=`${R.length} single-serving meals, ${Math.min(...k)}–${Math.max(...k)} kcal and ${Math.min(...q)}–${Math.max(...q)} g protein each: ${R.length-b} chicken, ${b} beef. Tap a recipe to scale it and cook along.`}
renderList();route();
</script>
</body>
</html>
